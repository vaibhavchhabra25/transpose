<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PitchShift</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="popup.css" />
</head>

<body>
  <div class="shell">

    <!-- Header -->
    <header>
      <div class="logo">
        <span class="logo-icon">♩</span>
        <span class="logo-text">PitchShift</span>
      </div>
      <div class="status-dot" id="statusDot" title="Not connected"></div>
    </header>

    <!-- Main display -->
    <div class="display-area">
      <div class="semitone-label">SEMITONES</div>
      <div class="semitone-value" id="semitoneValue">0</div>
      <div class="note-label" id="noteLabel">No change</div>
      <!-- <div class="chord-guide-container">
        <div class="chord-header">Live Chord</div>
        <div id="chord-display" class="chord-display">--</div>
      </div> -->
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="btn btn-large" id="btnMinus" aria-label="Down 1 semitone">−1</button>

      <div class="fine-controls">
        <button class="btn btn-small" id="btnMinusHalf" aria-label="Down half semitone">−½</button>
        <button class="btn btn-reset" id="btnReset" aria-label="Reset to 0">↺</button>
        <button class="btn btn-small" id="btnPlusHalf" aria-label="Up half semitone">+½</button>
      </div>

      <button class="btn btn-large" id="btnPlus" aria-label="Up 1 semitone">+1</button>
    </div>

    <div class="formant-control">
      <button id="btnFormant" class="btn secondary-btn">
        <span class="formant-icon" id="formantIcon">🗣️</span>
        Formant Preservation: <strong id="formantStatus">OFF</strong>
      </button>
    </div>

    <!-- Keyboard shortcut hints -->
    <div class="key-hints" style="line-height: 1.8;">
      <div>
        <span class="key">Alt</span> + <span class="key">−</span> / <span class="key">+</span> Pitch
        &nbsp;|&nbsp;
        <span class="key">Alt</span> + <span class="key">Shift</span> Fine Tune
      </div>
      <div>
        <span class="key">Alt</span> + <span class="key">0</span> Reset
        &nbsp;|&nbsp;
        <span class="key">Alt</span> + <span class="key">P</span> Formants
      </div>
      <div style="margin-top: 6px; font-size: 0.9em; opacity: 0.8;">
        <em>(When popup is open: Use <span class="key">←</span> / <span class="key">→</span> arrows for fine
          tuning)</em>
      </div>
    </div>

    <!-- Slider for quick sweep -->
    <div class="slider-area">
      <span class="slider-bound">−12</span>
      <input type="range" id="pitch-slider" min="-12" max="12" step="0.1" value="0">
      <span class="slider-bound">+12</span>
    </div>

    <!-- Footer status -->
    <div class="footer" id="footer">Scanning for media…</div>

  </div>
  <script src="popup.js"></script>
</body>

</html>
